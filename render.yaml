services:
  - type: web
    name: n8n
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    # Render injects $PORT — n8n must bind to it, not a hardcoded port.
    # The startCommand overrides the image entrypoint to pass $PORT at runtime.
    startCommand: n8n start --port $PORT
    envVars:
      - key: N8N_HOST
        value: 0.0.0.0
      # N8N_PORT is set dynamically from $PORT by startCommand above;
      # we still export it so n8n's internal URL builder is consistent.
      - key: N8N_PORT
        fromValue: $PORT
      - key: N8N_PROTOCOL
        value: https
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_URL
        value: https://n8n-20th.onrender.com/
      - key: GENERIC_TIMEZONE
        value: Africa/Nairobi
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: DB_POSTGRESDB_SCHEMA
        value: public
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "720"
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1

databases:
  - name: n8n-db
    databaseName: n8n
    user: n8n
    plan: free
