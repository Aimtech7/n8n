# Nginx reverse proxy override
# Usage: docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d
#
# Serves n8n at port 80 (HTTP) and 443 (HTTPS) via Nginx
# Place your SSL certs in ./nginx/ssl/cert.pem and ./nginx/ssl/key.pem

version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: n8n_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  n8n:
    ports: []  # Remove direct port exposure — only Nginx should be public
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PROTOCOL=https
