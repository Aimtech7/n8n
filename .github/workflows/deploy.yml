name: Deploy n8n

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  N8N_URL: https://n8n-20th.onrender.com

jobs:
  # ── Validate configs ─────────────────────────────────────────
  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Kubernetes manifests
        run: |
          curl -sLO https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          ./kubeval k8s/*.yaml --ignore-missing-schemas || true

  # ── Deploy to Render ─────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" --fail
          echo "✅ Render deploy triggered"

  # ── Health check after deploy ─────────────────────────────────
  healthcheck:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for Render to spin up (90s)
        run: sleep 90

      - name: Ping /healthz
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.N8N_URL }}/healthz)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed! n8n returned HTTP $STATUS"
            exit 1
          fi
          echo "✅ n8n is healthy at ${{ env.N8N_URL }}"

  # ── Summary ───────────────────────────────────────────────────
  notify:
    name: Summary
    runs-on: ubuntu-latest
    needs: [validate, deploy, healthcheck]
    if: always()
    steps:
      - name: Report
        run: |
          echo "Validate : ${{ needs.validate.result }}"
          echo "Deploy   : ${{ needs.deploy.result }}"
          echo "Health   : ${{ needs.healthcheck.result }}"
          if [[ "${{ needs.healthcheck.result }}" == "success" ]]; then
            echo "🚀 Deployment successful — ${{ env.N8N_URL }}"
          else
            echo "⚠️  Deployment may have issues — check Render dashboard"
          fi
