# Production hardened override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds: resource limits, read-only FS, non-root enforcement, stricter logging

version: "3.8"

services:
  n8n:
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - NODE_ENV=production
      - N8N_LOG_LEVEL=warn
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=720
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
